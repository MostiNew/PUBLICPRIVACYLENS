<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>PrivacyLens · Zero-Touch</title>

    <!-- jsQR — Lightweight QR decoder -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        #app-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
        }

        #preview {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        #overlay-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        /* ===== HUD ===== */
        .hud {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            font-weight: 500;
        }

        .hud-top {
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 14px;
            border-radius: 40px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-top .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            background: #f39c12;
            box-shadow: 0 0 12px #f39c12aa;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .hud-top .dot.active {
            background: #2ecc71;
            box-shadow: 0 0 12px #2ecc71aa;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        .hud-top .status {
            font-weight: 500;
            font-size: 11px;
        }

        .hud-bottom {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 12px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.6;
        }

        .hud-bottom .count {
            color: #8bebc8;
            font-weight: 600;
        }

        .hud-bottom .privacy {
            color: #e74c3c;
            font-weight: 600;
        }

        .hud-bottom .privacy.on {
            color: #2ecc71;
        }

        /* ===== QR OVERLAY ===== */
        .qr-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: block;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(1px);
        }

        .qr-overlay .box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid rgba(46, 204, 113, 0.3);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.03);
        }

        .qr-overlay .box .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #2ecc71;
            border-style: solid;
            border-width: 0;
        }

        .qr-overlay .box .corner.tl {
            top: -2px;
            left: -2px;
            border-top-width: 3px;
            border-left-width: 3px;
        }
        .qr-overlay .box .corner.tr {
            top: -2px;
            right: -2px;
            border-top-width: 3px;
            border-right-width: 3px;
        }
        .qr-overlay .box .corner.bl {
            bottom: -2px;
            left: -2px;
            border-bottom-width: 3px;
            border-left-width: 3px;
        }
        .qr-overlay .box .corner.br {
            bottom: -2px;
            right: -2px;
            border-bottom-width: 3px;
            border-right-width: 3px;
        }

        .qr-overlay .box .line {
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #2ecc71, transparent);
            animation: scan 2s ease-in-out infinite;
            transform: translateY(-50%);
            opacity: 0.3;
        }

        @keyframes scan {
            0%,
            100% {
                top: 10%;
            }
            50% {
                top: 90%;
            }
        }

        .qr-overlay .label {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 11px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: #2ecc71;
        }
        .toast.error {
            border-color: #e74c3c;
        }
        .toast.info {
            border-color: #3498db;
        }

        /* ===== SWITCH BUTTON ===== */
        .switch-btn {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 6px 16px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        .switch-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* ================================================================
           QR VIEW
           ================================================================ */
        #qr-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0a0e1a;
            overflow: hidden;
        }

        #qr-view.visible {
            display: flex;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 8s ease-in-out infinite alternate;
        }

        .bg-animation .orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: #2d8cff;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .bg-animation .orb:nth-child(2) {
            width: 350px;
            height: 350px;
            background: #8b5cf6;
            bottom: -100px;
            right: -100px;
            animation-delay: -3s;
        }

        .bg-animation .orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: #06b6d4;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
            100% {
                transform: translate(10px, -10px) scale(1.05);
            }
        }

        .qr-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 48px 40px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.8s ease-out;
            max-height: 95vh;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .qr-card .badge {
            display: inline-block;
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid rgba(46, 204, 113, 0.25);
            color: #2ecc71;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 4px 16px;
            border-radius: 40px;
            margin-bottom: 16px;
        }

        .qr-card .icon {
            font-size: 56px;
            margin-bottom: 8px;
            display: block;
            animation: pulse-icon 2s ease-in-out infinite;
        }

        @keyframes pulse-icon {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .qr-card .title {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .qr-card .title span {
            background: linear-gradient(135deg, #2d8cff, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .qr-card .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 24px;
        }

        .qr-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            display: inline-block;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            transition: transform 0.3s ease;
        }

        .qr-container:hover {
            transform: scale(1.02);
        }

        .qr-container .qr-code {
            width: 220px;
            height: 220px;
            display: block;
        }

        .qr-container .scan-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            border: 2px solid rgba(46, 204, 113, 0.15);
            border-radius: 24px;
            animation: ring-pulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes ring-pulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.08);
                opacity: 0;
            }
        }

        .qr-card .qr-value {
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 16px;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .qr-card .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .qr-card .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border: none;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .qr-card .btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.1);
        }

        .qr-card .btn:active {
            transform: scale(0.95);
        }

        .qr-card .btn-primary {
            background: linear-gradient(135deg, #2d8cff, #8b5cf6);
            color: #fff;
            border: none;
            box-shadow: 0 4px 24px rgba(45, 140, 255, 0.3);
        }

        .qr-card .btn-primary:hover {
            background: linear-gradient(135deg, #4a9eff, #9b6cf6);
            box-shadow: 0 6px 32px rgba(45, 140, 255, 0.4);
        }

        .qr-card .btn-success {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff;
            border: none;
            box-shadow: 0 4px 24px rgba(46, 204, 113, 0.3);
        }

        .qr-card .btn-success:hover {
            background: linear-gradient(135deg, #3ddc84, #2ecc71);
            box-shadow: 0 6px 32px rgba(46, 204, 113, 0.4);
        }

        .qr-card .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.7);
        }

        .qr-card .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .qr-card .btn .icon-sm {
            font-size: 16px;
        }

        .qr-card .footer {
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 520px) {
            .qr-card {
                padding: 32px 20px 28px;
                border-radius: 24px;
                max-height: 98vh;
            }
            .qr-card .title {
                font-size: 22px;
            }
            .qr-container .qr-code {
                width: 170px;
                height: 170px;
            }
            .qr-container .scan-ring {
                width: 200px;
                height: 200px;
            }
            .qr-card .btn {
                padding: 10px 20px;
                font-size: 13px;
                width: 100%;
                justify-content: center;
            }
            .qr-card .btn-group {
                flex-direction: column;
            }
            .qr-card .icon {
                font-size: 44px;
            }
            .hud-top {
                font-size: 10px;
                padding: 4px 12px;
            }
            .hud-bottom {
                font-size: 8px;
                padding: 3px 10px;
            }
            .qr-overlay .box {
                width: 160px;
                height: 160px;
            }
            .toast {
                font-size: 10px;
                padding: 6px 14px;
                bottom: 60px;
                white-space: normal;
            }
            .switch-btn {
                bottom: 70px;
                padding: 6px 16px;
                font-size: 10px;
            }
        }

        @media (max-width: 380px) {
            .qr-container .qr-code {
                width: 140px;
                height: 140px;
            }
            .qr-container .scan-ring {
                width: 170px;
                height: 170px;
            }
            .qr-container {
                padding: 16px;
            }
            .qr-card .title {
                font-size: 18px;
            }
        }

        /* ================================================================
           PRINT STYLES
           ================================================================ */
        @media print {
            #app-view {
                display: none !important;
            }
            #qr-view {
                position: static !important;
                display: flex !important;
                background: #fff !important;
                padding: 20px !important;
                min-height: 100vh;
            }
            .bg-animation {
                display: none !important;
            }
            .qr-card {
                background: #fff !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                border: 1px solid #e0e0e0 !important;
                box-shadow: none !important;
                padding: 40px !important;
                animation: none !important;
                max-height: none !important;
            }
            .qr-card .title {
                color: #000 !important;
            }
            .qr-card .title span {
                -webkit-text-fill-color: #1a1a2e !important;
                background: none !important;
            }
            .qr-card .subtitle {
                color: #666 !important;
            }
            .qr-container {
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06) !important;
                padding: 16px !important;
            }
            .qr-container .scan-ring {
                display: none !important;
            }
            .qr-card .badge {
                background: #f0f8f0 !important;
                color: #27ae60 !important;
                border-color: #d0e8d0 !important;
            }
            .qr-card .qr-value {
                color: #999 !important;
                background: #f5f5f5 !important;
            }
            .qr-card .btn-group {
                display: none !important;
            }
            .qr-card .footer {
                color: #ccc !important;
            }
            .switch-btn {
                display: none !important;
            }
            .toast {
                display: none !important;
            }
            .qr-overlay {
                display: none !important;
            }
        }

        @media (prefers-color-scheme: light) {
            #qr-view {
                background: #f0f4ff;
            }
            .bg-animation .orb {
                opacity: 0.2;
            }
            .qr-card {
                background: rgba(255, 255, 255, 0.8);
                border-color: rgba(255, 255, 255, 0.3);
            }
            .qr-card .title {
                color: #1a1a2e;
            }
            .qr-card .subtitle {
                color: rgba(0, 0, 0, 0.5);
            }
            .qr-card .qr-value {
                color: rgba(0, 0, 0, 0.3);
                background: rgba(0, 0, 0, 0.04);
            }
            .qr-card .btn-outline {
                color: rgba(0, 0, 0, 0.6);
                border-color: rgba(0, 0, 0, 0.08);
            }
            .qr-card .btn-outline:hover {
                background: rgba(0, 0, 0, 0.04);
            }
            .qr-card .footer {
                color: rgba(0, 0, 0, 0.15);
            }
            .qr-card .badge {
                background: rgba(46, 204, 113, 0.1);
                border-color: rgba(46, 204, 113, 0.2);
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    APP VIEW
    ============================================================ -->
    <div id="app-view">
        <video id="preview" playsinline autoplay muted></video>
        <canvas id="overlay-canvas"></canvas>

        <!-- QR Scanner Overlay -->
        <div class="qr-overlay" id="qr-overlay">
            <div class="box">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
                <div class="line"></div>
            </div>
            <div class="label" id="qr-label">🔍 Scanning for QR...</div>
        </div>

        <!-- HUD -->
        <div class="hud hud-top">
            <span class="dot" id="dot"></span>
            <span class="status" id="status">Scanning...</span>
        </div>

        <div class="hud hud-bottom">
            <span class="privacy" id="privacy">🔒 OFF</span>
            <span class="count" id="count">0 faces</span>
        </div>
    </div>

    <!-- ============================================================
    QR VIEW
    ============================================================ -->
    <div id="qr-view">
        <div class="bg-animation">
            <div class="orb"></div>
            <div class="orb"></div>
            <div class="orb"></div>
        </div>

        <div class="qr-card">
            <div class="badge">🔒 Zero-Touch Privacy</div>
            <span class="icon">🕶️</span>
            <h1 class="title">Privacy<span>Lens</span></h1>
            <p class="subtitle">Scan this QR code to activate privacy</p>

            <div class="qr-container">
                <div class="scan-ring"></div>
                <svg class="qr-code" id="qr-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"></svg>
            </div>

            <div class="qr-value" id="qr-value">PRIVACYLENS-ON</div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btn-download">
                    <span class="icon-sm">⬇️</span> Download PNG
                </button>
                <button class="btn btn-success" id="btn-print">
                    <span class="icon-sm">🖨️</span> Print
                </button>
                <button class="btn btn-outline" id="btn-copy">
                    <span class="icon-sm">📋</span> Copy
                </button>
            </div>

            <div class="footer">
                One QR · One Purpose · Privacy for Everyone
            </div>
        </div>
    </div>

    <!-- ============================================================
    SWITCH BUTTON
    ============================================================ -->
    <button class="switch-btn" id="switch-btn">
        <span class="icon-sm" id="switch-icon">📄</span>
        <span id="switch-label">Show QR</span>
    </button>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================
    JAVASCRIPT — FIXED QR SCANNER
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ================================================================
            // 1. CONFIGURATION
            // ================================================================

            const ACTIVATION_QR = 'PRIVACYLENS-ON';
            let isActive = false;
            let isReady = false;
            let stream = null;
            let isQRViewVisible = false;
            let frameCount = 0;
            let lastQRDetection = '';
            let qrDetectionCount = 0;

            // ================================================================
            // 2. DOM REFS
            // ================================================================

            const video = document.getElementById('preview');
            const canvas = document.getElementById('overlay-canvas');
            const ctx = canvas.getContext('2d');

            const dot = document.getElementById('dot');
            const status = document.getElementById('status');
            const privacy = document.getElementById('privacy');
            const count = document.getElementById('count');
            const toast = document.getElementById('toast');
            const qrOverlay = document.getElementById('qr-overlay');
            const qrLabel = document.getElementById('qr-label');

            const qrView = document.getElementById('qr-view');
            const switchBtn = document.getElementById('switch-btn');
            const switchIcon = document.getElementById('switch-icon');

            // ================================================================
            // 3. FACE DETECTION
            // ================================================================

            class SimpleFaceDetector {
                constructor() {
                    this.faces = [];
                    this.smoothFactor = 0.6;
                }

                detect(imageData) {
                    const data = imageData.data;
                    const w = imageData.width;
                    const h = imageData.height;

                    const candidates = [];
                    const step = 4;
                    let skinPixels = 0;

                    for (let y = 0; y < h; y += step) {
                        for (let x = 0; x < w; x += step) {
                            const idx = (y * w + x) * 4;
                            const r = data[idx];
                            const g = data[idx + 1];
                            const b = data[idx + 2];

                            const cb = -0.1687 * r - 0.3313 * g + 0.5 * b + 128;
                            const cr = 0.5 * r - 0.4187 * g - 0.0813 * b + 128;

                            if (cr >= 136 && cr <= 168 && cb >= 82 && cb <= 122) {
                                candidates.push({ x, y });
                                skinPixels++;
                            }
                        }
                    }

                    if (skinPixels < 20) return [];

                    const clusters = [];
                    const threshold = 20;

                    for (const p of candidates) {
                        let found = false;
                        for (const cluster of clusters) {
                            const dx = p.x - cluster.cx;
                            const dy = p.y - cluster.cy;
                            if (dx * dx + dy * dy < threshold * threshold) {
                                cluster.points.push(p);
                                cluster.cx = (cluster.cx * (cluster.points.length - 1) + p.x) / cluster.points.length;
                                cluster.cy = (cluster.cy * (cluster.points.length - 1) + p.y) / cluster.points.length;
                                found = true;
                                break;
                            }
                        }
                        if (!found) {
                            clusters.push({ cx: p.x, cy: p.y, points: [p] });
                        }
                    }

                    const rawFaces = [];
                    const minPixels = 40;
                    const maxPixels = 600;

                    for (const cluster of clusters) {
                        const count = cluster.points.length;
                        if (count < minPixels || count > maxPixels) continue;

                        let minX = Infinity,
                            minY = Infinity,
                            maxX = -Infinity,
                            maxY = -Infinity;
                        for (const p of cluster.points) {
                            if (p.x < minX) minX = p.x;
                            if (p.y < minY) minY = p.y;
                            if (p.x > maxX) maxX = p.x;
                            if (p.y > maxY) maxY = p.y;
                        }

                        const fw = maxX - minX;
                        const fh = maxY - minY;

                        if (fw < 20 || fh < 20 || fw > w * 0.5 || fh > h * 0.5) continue;

                        const aspectRatio = fw / fh;
                        if (aspectRatio < 0.55 || aspectRatio > 1.45) continue;

                        const relSize = (fw * fh) / (w * h);
                        if (relSize < 0.02 || relSize > 0.45) continue;

                        const density = count / (fw * fh);
                        if (density < 0.15) continue;

                        rawFaces.push({
                            x: Math.max(0, minX / w),
                            y: Math.max(0, minY / h),
                            width: Math.min(1, fw / w),
                            height: Math.min(1, fh / h),
                            confidence: Math.min(1, density / 0.5),
                        });
                    }

                    const uniqueFaces = [];
                    const dedupThreshold = 0.06;

                    for (const face of rawFaces) {
                        let isDuplicate = false;
                        for (const existing of uniqueFaces) {
                            const dx = face.x - existing.x;
                            const dy = face.y - existing.y;
                            if (dx * dx + dy * dy < dedupThreshold * dedupThreshold) {
                                isDuplicate = true;
                                break;
                            }
                        }
                        if (!isDuplicate) {
                            uniqueFaces.push(face);
                        }
                    }

                    let finalFaces = uniqueFaces;

                    if (this.faces.length > 0 && uniqueFaces.length > 0) {
                        const minLen = Math.min(this.faces.length, uniqueFaces.length);
                        for (let i = 0; i < minLen; i++) {
                            finalFaces[i] = {
                                x: this.faces[i].x * this.smoothFactor + uniqueFaces[i].x * (1 - this.smoothFactor),
                                y: this.faces[i].y * this.smoothFactor + uniqueFaces[i].y * (1 - this.smoothFactor),
                                width: this.faces[i].width * this.smoothFactor + uniqueFaces[i].width * (1 - this
                                    .smoothFactor),
                                height: this.faces[i].height * this.smoothFactor + uniqueFaces[i].height * (1 - this
                                    .smoothFactor),
                                confidence: uniqueFaces[i].confidence,
                            };
                        }
                    }

                    if (uniqueFaces.length === 0 && this.faces.length > 0) {
                        finalFaces = this.faces.map(f => ({ ...f, confidence: f.confidence * 0.9 }));
                        finalFaces = finalFaces.filter(f => f.confidence > 0.3);
                    }

                    this.faces = finalFaces;
                    return finalFaces;
                }
            }

            const detector = new SimpleFaceDetector();
