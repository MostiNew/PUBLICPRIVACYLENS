<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>PrivacyLens · One QR</title>

    <!-- MediaPipe Face Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin></script>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
            user-select: none;
        }

        #preview {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        #overlay-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        /* ===== HUD ===== */
        .hud {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            font-weight: 500;
        }

        .hud-top {
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 16px;
            border-radius: 40px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-top .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: #555;
            animation: none;
        }

        .hud-top .dot.active {
            background: #2ecc71;
            box-shadow: 0 0 12px #2ecc71aa;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .hud-top .dot.scanning {
            background: #f39c12;
            box-shadow: 0 0 12px #f39c12aa;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        .hud-top .status {
            font-weight: 600;
        }

        .hud-bottom {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 14px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.6;
        }

        .hud-bottom .count {
            color: #8bebc8;
            font-weight: 600;
        }

        .hud-bottom .privacy {
            color: #e74c3c;
            font-weight: 600;
        }

        .hud-bottom .privacy.on {
            color: #2ecc71;
        }

        /* ===== QR OVERLAY ===== */
        .qr-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: none;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
        }

        .qr-overlay.active {
            display: block;
            pointer-events: auto;
        }

        .qr-overlay .box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid rgba(46, 204, 113, 0.5);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.1);
        }

        .qr-overlay .box .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #2ecc71;
            border-style: solid;
            border-width: 0;
        }

        .qr-overlay .box .corner.tl {
            top: -2px;
            left: -2px;
            border-top-width: 3px;
            border-left-width: 3px;
        }
        .qr-overlay .box .corner.tr {
            top: -2px;
            right: -2px;
            border-top-width: 3px;
            border-right-width: 3px;
        }
        .qr-overlay .box .corner.bl {
            bottom: -2px;
            left: -2px;
            border-bottom-width: 3px;
            border-left-width: 3px;
        }
        .qr-overlay .box .corner.br {
            bottom: -2px;
            right: -2px;
            border-bottom-width: 3px;
            border-right-width: 3px;
        }

        .qr-overlay .box .line {
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #2ecc71, transparent);
            animation: scan 2s ease-in-out infinite;
            transform: translateY(-50%);
            opacity: 0.6;
        }

        @keyframes scan {
            0%,
            100% {
                top: 10%;
            }
            50% {
                top: 90%;
            }
        }

        .qr-overlay .label {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: #2ecc71;
        }
        .toast.error {
            border-color: #e74c3c;
        }
        .toast.info {
            border-color: #3498db;
        }

        @media (max-width: 768px) {
            .hud-top {
                font-size: 10px;
                padding: 4px 12px;
            }
            .hud-bottom {
                font-size: 8px;
                padding: 3px 10px;
            }
            .qr-overlay .box {
                width: 160px;
                height: 160px;
            }
            .toast {
                font-size: 10px;
                padding: 6px 14px;
                bottom: 60px;
                white-space: normal;
            }
        }
    </style>
</head>
<body>

    <!-- ===== CAMERA ===== -->
    <video id="preview" playsinline autoplay muted></video>
    <canvas id="overlay-canvas"></canvas>

    <!-- ===== QR OVERLAY ===== -->
    <div class="qr-overlay" id="qr-overlay">
        <div class="box">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="line"></div>
        </div>
        <div class="label" id="qr-label">🔍 Scan QR to Activate</div>
    </div>

    <!-- ===== HUD ===== -->
    <div class="hud hud-top">
        <span class="dot" id="dot"></span>
        <span class="status" id="status">Loading...</span>
    </div>

    <div class="hud hud-bottom">
        <span class="privacy" id="privacy">🔒 OFF</span>
        <span class="count" id="count">0 faces</span>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            // 1. ONE QR CODE
            // ================================================================

            const ACTIVATION_QR = 'PRIVACYLENS-ON';

            // ================================================================
            // 2. DOM REFS
            // ================================================================

            const video = document.getElementById('preview');
            const canvas = document.getElementById('overlay-canvas');
            const ctx = canvas.getContext('2d');

            const dot = document.getElementById('dot');
            const status = document.getElementById('status');
            const privacy = document.getElementById('privacy');
            const count = document.getElementById('count');
            const toast = document.getElementById('toast');
            const qrOverlay = document.getElementById('qr-overlay');
            const qrLabel = document.getElementById('qr-label');

            // ================================================================
            // 3. STATE
            // ================================================================

            let isActive = false;
            let isScanning = false;
            let faceDetection = null;
            let camera = null;
            let scanInterval = null;
            let toastTimer = null;
            let isReady = false;

            // ================================================================
            // 4. MEDIAPIPE FACE DETECTION — FAST & ACCURATE
            // ================================================================

            function initFaceDetection() {
                faceDetection = new FaceDetection({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`;
                    }
                });

                faceDetection.setOptions({
                    model: 'short', // 'short' = faster, 'full' = more accurate
                    minDetectionConfidence: 0.65,
                    selfieMode: true,
                });

                faceDetection.onResults(onFaceResults);

                // Start camera
                camera = new Camera(video, {
                    onFrame: async () => {
                        if (faceDetection && isReady) {
                            await faceDetection.send({ image: video });
                        }
                    },
                    width: 640,
                    height: 480,
                    facingMode: 'environment',
                });

                camera.start().then(() => {
                    isReady = true;
                    status.textContent = 'Scan QR';
                    dot.className = 'dot scanning';
                    showToast('📷 Camera ready — scan QR to activate', 'info', 3000);
                    startQRScanner();
                }).catch(err => {
                    console.error('Camera error:', err);
                    showToast('❌ Camera error: ' + err.message, 'error', 4000);
                });
            }

            // ================================================================
            // 5. DRAW OVERLAY — FAST BLUR WITH MEDIAPIPE RESULTS
            // ================================================================

            function onFaceResults(results) {
                const detections = results.detections || [];
                const w = canvas.width / (window.devicePixelRatio || 1);
                const h = canvas.height / (window.devicePixelRatio || 1);

                // Clear canvas
                ctx.clearRect(0, 0, w, h);

                // Update face count
                const faceCount = detections.length;
                count.textContent = faceCount + ' faces';

                // If privacy is NOT active, show a lock overlay
                if (!isActive) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
                    ctx.fillRect(0, 0, w, h);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.font = '40px system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🔒', w / 2, h / 2);
                    ctx.font = '14px system-ui, sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.fillText('Scan QR to activate', w / 2, h / 2 + 60);
                    return;
                }

                // Privacy ACTIVE — blur faces
                if (detections.length === 0) return;

                for (const detection of detections) {
                    const bbox = detection.boundingBox;
                    const x = bbox.xMin * w;
                    const y = bbox.yMin * h;
                    const fw = (bbox.xMax - bbox.xMin) * w;
                    const fh = (bbox.yMax - bbox.yMin) * h;

                    // Expand box slightly for better coverage
                    const pad = 0.1;
                    const px = x - fw * pad;
                    const py = y - fh * pad;
                    const pw = fw * (1 + pad * 2);
                    const ph = fh * (1 + pad * 2);

                    // Mosaic blur (faster than Gaussian)
                    const step = 12;
                    for (let row = py; row < py + ph; row += step) {
                        for (let col = px; col < px + pw; col += step) {
                            const hue = ((row * 0.3 + col * 0.7 + 180) % 360);
                            ctx.fillStyle = `hsl(${hue}, 40%, 50%)`;
                            ctx.fillRect(col, row, step, step);
                        }
                    }

                    // Dark overlay
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                    ctx.fillRect(px, py, pw, ph);

                    // Red privacy border
                    ctx.strokeStyle = 'rgba(231, 76, 60, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 6]);
                    ctx.strokeRect(px, py, pw, ph);
                    ctx.setLineDash([]);

                    // Lock icon
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.font = '16px system-ui, sans-serif';
                    ctx.fillText('🔒', px + 8, py + 28);
                }
            }

            // ================================================================
            // 6. QR SCANNER
            // ================================================================

            function startQRScanner() {
                if (isScanning) return;

                if (!('BarcodeDetector' in window)) {
                    showToast('⚠️ QR scanning not supported', 'error', 3000);
                    showManualActivation();
                    return;
                }

                isScanning = true;
                qrOverlay.classList.add('active');
                qrLabel.textContent = '🔍 Scan QR to Activate';
                dot.className = 'dot scanning';
                status.textContent = 'Scanning...';
                showToast('📸 Scan the QR code to activate privacy', 'info', 3000);

                const barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });

                scanInterval = setInterval(async () => {
                    if (!isScanning) {
                        clearInterval(scanInterval);
                        return;
                    }

                    try {
                        if (!video || !video.videoWidth || video.videoWidth === 0) return;

                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = Math.min(video.videoWidth, 480);
                        tempCanvas.height = Math.min(video.videoHeight, 360);
                        const tempCtx = tempCanvas.getContext('2d');
                        tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

                        const bitmap = await createImageBitmap(
                            tempCanvas.getImageData(0, 0, tempCanvas.width, tempCanvas.height)
                        );
                        const detections = await barcodeDetector.detect(bitmap);
                        bitmap.close();

                        for (const detection of detections) {
                            const code = detection.rawValue.toUpperCase().trim();
                            if (code === ACTIVATION_QR) {
                                clearInterval(scanInterval);
                                activatePrivacy();
                                return;
                            } else {
                                qrLabel.textContent = '❌ Wrong QR — use the official one';
                                showToast('❌ This QR is not valid for PrivacyLens', 'error', 1500);
                            }
                        }
                    } catch (err) {
                        // Silent fail — keep scanning
                    }
                }, 500);
            }

            // ================================================================
            // 7. ACTIVATE PRIVACY
            // ================================================================

            function activatePrivacy() {
                isActive = true;
                isScanning = false;
                qrOverlay.classList.remove('active');

                dot.className = 'dot active';
                status.textContent = '🔒 PRIVACY ON';
                privacy.textContent = '🔒 ON';
                privacy.className = 'privacy on';

                showToast('✅ Privacy activated — all faces blurred!', 'success', 3000);

                if (scanInterval) {
                    clearInterval(scanInterval);
                    scanInterval = null;
                }
            }

            // ================================================================
            // 8. FALLBACK — Manual Activation
            // ================================================================

            function showManualActivation() {
                qrOverlay.classList.add('active');
                qrLabel.textContent = '📲 Tap to Activate Privacy';
                dot.className = 'dot scanning';
                status.textContent = 'Tap to Activate';

                qrOverlay.addEventListener('click', function handler() {
                    activatePrivacy();
                    qrOverlay.removeEventListener('click', handler);
                });
            }

            // ================================================================
            // 9. TOAST
            // ================================================================

            function showToast(msg, type = 'info', duration = 2000) {
                if (toastTimer) clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.className = 'toast visible ' + type;
                toastTimer = setTimeout(() => {
                    toast.className = 'toast';
                }, duration);
            }

            // ================================================================
            // 10. QR CODE GENERATOR
            // ================================================================

            function generateQRPage() {
                const html = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>PrivacyLens Activation QR</title>
                    <style>
                        body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
                        .card { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 100%; }
                        .qr { width: 200px; height: 200px; margin: 0 auto 20px; background: #fff; display: flex; align-items: center; justify-content: center; border: 1px solid #eee; border-radius: 8px; }
                        .qr svg { width: 100%; height: 100%; }
                        h1 { font-size: 20px; margin-bottom: 4px; }
                        .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
                        .instructions { background: #e8f4fd; padding: 16px; border-radius: 8px; border: 1px solid #b8d4e8; font-size: 13px; text-align: left; }
                        .instructions strong { color: #1a5276; }
                        @media print {
                            body { background: #fff; padding: 0; }
                            .card { box-shadow: none; padding: 20px; }
                            .instructions { background: #f5f5f5; border-color: #ddd; }
                        }
                    </style>
                </head>
                <body>
                    <div class="card">
                        <h1>🕶️ PrivacyLens</h1>
                        <p class="sub">Scan this QR code to activate privacy</p>
                        <div class="qr">${generateQRCodeSVG('PRIVACYLENS-ON')}</div>
                        <div class="instructions">
                            <strong>📌 How to use:</strong><br>
                            1. Print and place this QR code at your entrance.<br>
                            2. Open PrivacyLens on your smart glasses.<br>
                            3. Point at this QR code.<br>
                            4. <strong>All faces will be blurred automatically!</strong>
                        </div>
                    </div>
                </body>
                </html>
                `;
                return html;
            }

            function generateQRCodeSVG(text) {
                const size = 200,
                    cells = 21,
                    cellSize = size / cells;
                let hash = 0;
                for (let i = 0; i < text.length; i++) {
                    hash = ((hash << 5) - hash) + text.charCodeAt(i);
                    hash = hash & hash;
                }
                let svg =
                    `<svg width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg"><rect width="${size}" height="${size}" fill="white"/>`;
                for (let row = 0; row < cells; row++) {
                    for (let col = 0; col < cells; col++) {
                        const val = (hash * (row * cells + col + 1)) % 2;
                        if (val === 1) {
                            svg +=
                                `<rect x="${col * cellSize}" y="${row * cellSize}" width="${cellSize}" height="${cellSize}" fill="#000"/>`;
                        }
                    }
                }
                const addFinder = (x, y) => {
                    for (let r = 0; r < 7; r++) {
                        for (let c = 0; c < 7; c++) {
                            if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
                                svg +=
                                    `<rect x="${(x + c) * cellSize}" y="${(y + r) * cellSize}" width="${cellSize}" height="${cellSize}" fill="#000"/>`;
                            }
                        }
                    }
                };
                addFinder(0, 0);
                addFinder(cells - 7, 0);
                addFinder(0, cells - 7);
                svg += '</svg>';
                return svg;
            }

            // ================================================================
            // 11. RESIZE CANVAS
            // ================================================================

            function resizeCanvas() {
                const rect = video.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                ctx.scale(dpr, dpr);
            }

            // ================================================================
            // 12. KEYBOARD SHORTCUTS
            // ================================================================

            document.addEventListener('keydown', (e) => {
                if (e.key === 'g' || e.key === 'G') {
                    const qrHTML = generateQRPage();
                    const win = window.open('', '_blank');
                    win.document.write(qrHTML);
                    win.document.close();
                    showToast('📄 QR code generated — print it!', 'success', 2000);
                }
                if (e.key === 'p' || e.key === 'P') {
                    const qrHTML = generateQRPage();
                    const win = window.open('', '_blank');
                    win.document.write(qrHTML);
                    win.document.close();
                    setTimeout(() => win.print(), 1000);
                }
                if (e.key === 'r' || e.key === 'R') {
                    isActive = false;
                    dot.className = 'dot scanning';
                    status.textContent = 'Scanning...';
                    privacy.textContent = '🔒 OFF';
                    privacy.className = 'privacy';
                    showToast('🔄 Reset — scan QR to activate', 'info', 2000);
                    if (!isScanning) startQRScanner();
                }
            });

            // ================================================================
            // 13. INIT
            // ================================================================

            function init() {
                dot.className = 'dot';
                status.textContent = 'Loading MediaPipe...';
                privacy.textContent = '🔒 OFF';
                privacy.className = 'privacy';

                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);

                // Load MediaPipe
                initFaceDetection();

                console.log('🕶️ PrivacyLens — MediaPipe Face Detection');
                console.log('📸 Scan QR: ' + ACTIVATION_QR);
                console.log('📄 Press G to generate QR code');
                console.log('🔄 Press R to reset');
                console.log('🖨️ Press P to print QR code');
            }

            init();

            // Cleanup
            window.addEventListener('beforeunload', () => {
                if (camera) camera.stop();
                if (scanInterval) clearInterval(scanInterval);
            });

        })();
    </script>
</body>
</html>
