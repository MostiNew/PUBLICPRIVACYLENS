<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>PrivacyLens · Always On</title>

    <!-- MediaPipe Face Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js">
    </script>

    <!-- jsQR -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #camera {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        #output {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        /* QR Overlay — Disappears on detection */
        .qr-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .qr-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .qr-overlay .box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            border: 1.5px solid rgba(46, 204, 113, 0.2);
            border-radius: 12px;
        }

        .qr-overlay .box .corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: rgba(46, 204, 113, 0.25);
            border-style: solid;
            border-width: 0;
        }
        .qr-overlay .box .corner.tl {
            top: -2px;
            left: -2px;
            border-top-width: 2px;
            border-left-width: 2px;
        }
        .qr-overlay .box .corner.tr {
            top: -2px;
            right: -2px;
            border-top-width: 2px;
            border-right-width: 2px;
        }
        .qr-overlay .box .corner.bl {
            bottom: -2px;
            left: -2px;
            border-bottom-width: 2px;
            border-left-width: 2px;
        }
        .qr-overlay .box .corner.br {
            bottom: -2px;
            right: -2px;
            border-bottom-width: 2px;
            border-right-width: 2px;
        }

        .qr-overlay .box .line {
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(46, 204, 113, 0.2), transparent);
            animation: scanLine 2s ease-in-out infinite;
            transform: translateY(-50%);
        }

        @keyframes scanLine {
            0%,
            100% {
                top: 10%;
            }
            50% {
                top: 90%;
            }
        }

        .qr-overlay .label {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.15);
            font-size: 10px;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        /* HUD — Almost invisible */
        .hud {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.08);
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        .hud-top {
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            background: rgba(0, 0, 0, 0.1);
            padding: 1px 10px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.01);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-top .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            display: inline-block;
            background: #555;
        }

        .hud-top .dot.active {
            background: #2ecc71;
            box-shadow: 0 0 6px rgba(46, 204, 113, 0.15);
        }

        .hud-bottom {
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 7px;
            background: rgba(0, 0, 0, 0.08);
            padding: 1px 8px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.01);
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.3;
        }

        .hud-bottom .count {
            color: rgba(139, 235, 200, 0.3);
        }

        @media (max-width: 600px) {
            .qr-overlay .box {
                width: 130px;
                height: 130px;
            }
            .qr-overlay .label {
                font-size: 8px;
                bottom: 22%;
            }
        }

        @media (orientation: landscape) {
            .qr-overlay .box {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <video id="camera" playsinline autoplay muted></video>
    <canvas id="output"></canvas>

    <div class="qr-overlay" id="qrOverlay">
        <div class="box">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="line"></div>
        </div>
        <div class="label">🔍</div>
    </div>

    <div class="hud hud-top">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">•</span>
    </div>

    <div class="hud hud-bottom">
        <span class="count" id="faceCount"></span>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            // CONFIG — One QR, One Purpose
            // ================================================================

            const TARGET_QR = 'PRIVACYLENS-ON';
            let privacyActive = false;
            let isReady = false;
            let stream = null;
            let detectedFaces = [];
            let faceDetector = null;
            let frameSkip = 0;

            // ================================================================
            // DOM
            // ================================================================

            const video = document.getElementById('camera');
            const canvas = document.getElementById('output');
            const ctx = canvas.getContext('2d');

            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const faceCount = document.getElementById('faceCount');
            const qrOverlay = document.getElementById('qrOverlay');

            // ================================================================
            // CAMERA — Always On
            // ================================================================

            async function startCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        },
                        audio: false
                    });

                    video.srcObject = stream;

                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        isReady = true;
                        initFaceDetection();
                        processFrame();
                        startAutoQRScanner();
                    };

                } catch (error) {
                    console.error('Camera error:', error);
                    setTimeout(startCamera, 3000);
                }
            }

            // ================================================================
            // FACE DETECTION — Zero Latency Pipeline
            // ================================================================

            function initFaceDetection() {
                try {
                    faceDetector = new FaceDetection({
                        locateFile: (file) => {
                            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`;
                        }
                    });

                    faceDetector.setOptions({
                        model: 'short',
                        minDetectionConfidence: 0.6
                    });

                    faceDetector.onResults((results) => {
                        detectedFaces = [];
                        if (results.detections) {
                            results.detections.forEach((face) => {
                                const box = face.boundingBox;
                                const x = (box.xCenter - box.width / 2) * canvas.width;
                                const y = (box.yCenter - box.height / 2) * canvas.height;
                                const w = box.width * canvas.width;
                                const h = box.height * canvas.height;
                                detectedFaces.push({ x, y, w, h });
                            });
                        }
                        const count = detectedFaces.length;
                        faceCount.textContent = count > 0 ? count + ' faces' : '';
                    });

                } catch (error) {
                    console.error('Face detection error:', error);
                }
            }

            // ================================================================
            // QR SCANNER — Continuous, Silent
            // ================================================================

            let qrScanInterval = null;

            function startAutoQRScanner() {
                const useBarcodeDetector = 'BarcodeDetector' in window;

                if (useBarcodeDetector) {
                    const barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });

                    qrScanInterval = setInterval(async () => {
                        if (privacyActive) {
                            qrOverlay.classList.add('hidden');
                            return;
                        }

                        try {
                            if (!video || video.readyState < 2) return;

                            const tempCanvas = document.createElement('canvas');
                            tempCanvas.width = Math.min(video.videoWidth || 640, 480);
                            tempCanvas.height = Math.min(video.videoHeight || 480, 360);
                            const tempCtx = tempCanvas.getContext('2d');
                            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

                            const detections = await barcodeDetector.detect(tempCanvas);

                            for (const detection of detections) {
                                const code = detection.rawValue.toUpperCase().trim();
                                if (code === TARGET_QR) {
                                    activatePrivacy();
                                    return;
                                }
                            }
                        } catch (err) {
                            // Silent fail
                        }
                    }, 300);
                } else {
                    // jsQR fallback
                    qrScanInterval = setInterval(() => {
                        if (privacyActive) {
                            qrOverlay.classList.add('hidden');
                            return;
                        }

                        try {
                            if (!video || video.readyState < 2) return;

                            const tempCanvas = document.createElement('canvas');
                            tempCanvas.width = Math.min(video.videoWidth || 640, 480);
                            tempCanvas.height = Math.min(video.videoHeight || 480, 360);
                            const tempCtx = tempCanvas.getContext('2d');
                            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

                            const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                            const code = jsQR(imageData.data, imageData.width, imageData.height);

                            if (code && code.data) {
                                const decoded = code.data.toUpperCase().trim();
                                if (decoded === TARGET_QR) {
                                    activatePrivacy();
                                    return;
                                }
                            }
                        } catch (err) {
                            // Silent fail
                        }
                    }, 400);
                }
            }

            // ================================================================
            // ACTIVATE — Once, Instantly, Forever
            // ================================================================

            function activatePrivacy() {
                if (privacyActive) return;
                privacyActive = true;

                statusDot.className = 'dot active';
                statusText.textContent = '•';
                qrOverlay.classList.add('hidden');

                if (qrScanInterval) {
                    clearInterval(qrScanInterval);
                    qrScanInterval = null;
                }
            }

            // ================================================================
            // PRIVACY BLUR — Zero Latency Pixelation
            // ================================================================

            function applyPrivacyMask() {
                if (detectedFaces.length === 0) return;

                // Process all faces
                for (const face of detectedFaces) {
                    const x = Math.max(0, face.x);
                    const y = Math.max(0, face.y);
                    const w = Math.min(canvas.width - x, face.w);
                    const h = Math.min(canvas.height - y, face.h);

                    if (w < 8 || h < 8) continue;

                    // Get image data for this face
                    const imageData = ctx.getImageData(x, y, w, h);
                    const data = imageData.data;
                    const pixelSize = Math.max(6, Math.min(14, Math.round((w + h) / 40)));

                    // Pixelate
                    for (let row = 0; row < h; row += pixelSize) {
                        for (let col = 0; col < w; col += pixelSize) {
                            let r = 0,
                                g = 0,
                                b = 0,
                                count = 0;
                            for (let dy = 0; dy < pixelSize && row + dy < h; dy++) {
                                for (let dx = 0; dx < pixelSize && col + dx < w; dx++) {
                                    const idx = ((row + dy) * w + (col + dx)) * 4;
                                    r += data[idx];
                                    g += data[idx + 1];
                                    b += data[idx + 2];
                                    count++;
                                }
                            }
                            if (count > 0) {
                                r = Math.round(r / count);
                                g = Math.round(g / count);
                                b = Math.round(b / count);
                            }

                            for (let dy = 0; dy < pixelSize && row + dy < h; dy++) {
                                for (let dx = 0; dx < pixelSize && col + dx < w; dx++) {
                                    const idx = ((row + dy) * w + (col + dx)) * 4;
                                    data[idx] = r;
                                    data[idx + 1] = g;
                                    data[idx + 2] = b;
                                }
                            }
                        }
                    }

                    ctx.putImageData(imageData, x, y);

                    // Subtle privacy border
                    ctx.strokeStyle = 'rgba(239, 68, 68, 0.15)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 5]);
                    ctx.strokeRect(x, y, w, h);
                    ctx.setLineDash([]);
                }
            }

            // ================================================================
            // PROCESS LOOP — Zero Latency
            // ================================================================

            function processFrame() {
                if (!isReady || !video || video.readyState < 2) {
                    requestAnimationFrame(processFrame);
                    return;
                }

                try {
                    // Draw the video frame
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    // Run face detection
                    if (faceDetector) {
                        faceDetector.send({ image: video });
                    }

                    // If privacy is active, blur faces
                    if (privacyActive && detectedFaces.length > 0) {
                        applyPrivacyMask();
                    }

                    requestAnimationFrame(processFrame);

                } catch (error) {
                    console.error('Process error:', error);
                    requestAnimationFrame(processFrame);
                }
            }

            // ================================================================
            // INIT
            // ================================================================

            console.log('🕶️ PrivacyLens — Always On');
            console.log('📸 QR: ' + TARGET_QR);
            console.log('⚡ Zero latency face blurring');

            // Start everything
            startCamera();

            window.addEventListener('beforeunload', () => {
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                }
                if (qrScanInterval) {
                    clearInterval(qrScanInterval);
                    qrScanInterval = null;
                }
            });

        })();
    </script>
</body>
</html>
