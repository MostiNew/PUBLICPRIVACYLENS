<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>PrivacyLens</title>

    <!-- MediaPipe Face Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #camera {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        #output {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        .qr-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
            transition: opacity 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .qr-overlay.hidden {
            opacity: 0;
        }
        .qr-overlay .box {
            width: 160px;
            height: 160px;
            border: 2px solid rgba(46, 204, 113, 0.2);
            border-radius: 12px;
            position: relative;
        }
        .qr-overlay .box .corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: rgba(46, 204, 113, 0.25);
            border-style: solid;
            border-width: 0;
        }
        .qr-overlay .box .corner.tl {
            top: -2px;
            left: -2px;
            border-top-width: 2px;
            border-left-width: 2px;
        }
        .qr-overlay .box .corner.tr {
            top: -2px;
            right: -2px;
            border-top-width: 2px;
            border-right-width: 2px;
        }
        .qr-overlay .box .corner.bl {
            bottom: -2px;
            left: -2px;
            border-bottom-width: 2px;
            border-left-width: 2px;
        }
        .qr-overlay .box .corner.br {
            bottom: -2px;
            right: -2px;
            border-bottom-width: 2px;
            border-right-width: 2px;
        }
        .qr-overlay .box .line {
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(46, 204, 113, 0.2), transparent);
            animation: scanLine 2s ease-in-out infinite;
            transform: translateY(-50%);
        }
        @keyframes scanLine {
            0%,
            100% {
                top: 10%;
            }
            50% {
                top: 90%;
            }
        }
        .qr-overlay .label {
            color: rgba(255, 255, 255, 0.15);
            font-size: 10px;
            font-family: system-ui, sans-serif;
            margin-top: 16px;
            letter-spacing: 0.5px;
        }
        .hud {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.08);
            font-family: system-ui, sans-serif;
        }
        .hud-top {
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 10px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hud-top .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            display: inline-block;
            background: #555;
        }
        .hud-top .dot.active {
            background: #2ecc71;
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.3);
        }
        .hud-bottom {
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 7px;
            background: rgba(0, 0, 0, 0.08);
            padding: 1px 8px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.3;
        }
        .hud-bottom .count {
            color: rgba(139, 235, 200, 0.3);
        }
        @media (max-width: 600px) {
            .qr-overlay .box {
                width: 130px;
                height: 130px;
            }
        }
    </style>
</head>
<body>

    <video id="camera" playsinline autoplay muted></video>
    <canvas id="output"></canvas>

    <div class="qr-overlay" id="qrOverlay">
        <div class="box">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="line"></div>
        </div>
        <div class="label">🔍</div>
    </div>

    <div class="hud hud-top">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">•</span>
    </div>

    <div class="hud hud-bottom">
        <span class="count" id="faceCount"></span>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            // CONFIG
            // ================================================================

            const TARGET_QR = 'PRIVACYLENS-ON';
            let privacyActive = false;
            let isReady = false;
            let stream = null;
            let detectedFaces = [];

            // ================================================================
            // DOM
            // ================================================================

            const video = document.getElementById('camera');
            const canvas = document.getElementById('output');
            const ctx = canvas.getContext('2d');

            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const faceCount = document.getElementById('faceCount');
            const qrOverlay = document.getElementById('qrOverlay');

            // ================================================================
            // 1. FACE DETECTION — Two Methods
            // ================================================================

            // --- METHOD A: MediaPipe (Primary) ---
            let faceDetector = null;

            function initMediaPipe() {
                try {
                    faceDetector = new FaceDetection({
                        locateFile: (file) => {
                            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`;
                        }
                    });

                    faceDetector.setOptions({
                        model: 'short',
                        minDetectionConfidence: 0.6
                    });

                    faceDetector.onResults((results) => {
                        detectedFaces = [];
                        if (results.detections && results.detections.length > 0) {
                            results.detections.forEach((face) => {
                                const box = face.boundingBox;
                                const x = (box.xCenter - box.width / 2) * canvas.width;
                                const y = (box.yCenter - box.height / 2) * canvas.height;
                                const w = box.width * canvas.width;
                                const h = box.height * canvas.height;
                                detectedFaces.push({ x, y, w, h });
                            });
                        }
                        updateFaceCount();
                    });

                    console.log('✅ MediaPipe initialized');
                    return true;

                } catch (error) {
                    console.warn('MediaPipe init failed:', error);
                    return false;
                }
            }

            // --- METHOD B: Simple Fallback (runs immediately) ---
            function simpleFaceDetect(imageData) {
                const faces = [];
                const data = imageData.data;
                const w = imageData.width;
                const h = imageData.height;

                // Skin color detection (fast)
                for (let y = 0; y < h; y += 6) {
                    for (let x = 0; x < w; x += 6) {
                        const idx = (y * w + x) * 4;
                        const r = data[idx];
                        const g = data[idx + 1];
                        const b = data[idx + 2];

                        // YCbCr skin detection
                        const cb = -0.1687 * r - 0.3313 * g + 0.5 * b + 128;
                        const cr = 0.5 * r - 0.4187 * g - 0.0813 * b + 128;

                        if (cr >= 133 && cr <= 173 && cb >= 77 && cb <= 127) {
                            // Check for face-like cluster
                            let found = false;
                            for (const face of faces) {
                                const dx = x - face.x;
                                const dy = y - face.y;
                                if (dx * dx + dy * dy < 900) {
                                    face.count++;
                                    face.x = (face.x * (face.count - 1) + x) / face.count;
                                    face.y = (face.y * (face.count - 1) + y) / face.count;
                                    found = true;
                                    break;
                                }
                            }
                            if (!found) {
                                faces.push({ x, y, count: 1, w: 0, h: 0 });
                            }
                        }
                    }
                }

                // Filter and create bounding boxes
                const result = [];
                for (const f of faces) {
                    if (f.count > 15) {
                        const size = Math.sqrt(f.count) * 2.5;
                        result.push({
                            x: Math.max(0, (f.x - size / 2) / w),
                            y: Math.max(0, (f.y - size / 2) / h),
                            width: Math.min(1, size / w),
                            height: Math.min(1, size / h)
                        });
                    }
                }

                return result;
            }

            // ================================================================
            // 2. QR SCANNER
            // ================================================================

            let qrScanInterval = null;

            function startAutoQRScanner() {
                const useBarcodeDetector = 'BarcodeDetector' in window;

                if (useBarcodeDetector) {
                    const barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });

                    qrScanInterval = setInterval(async () => {
                        if (privacyActive) {
                            qrOverlay.classList.add('hidden');
                            return;
                        }

                        try {
                            if (!video || video.readyState < 2) return;

                            const tempCanvas = document.createElement('canvas');
                            tempCanvas.width = Math.min(video.videoWidth || 640, 480);
                            tempCanvas.height = Math.min(video.videoHeight || 480, 360);
                            const tempCtx = tempCanvas.getContext('2d');
                            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

                            const detections = await barcodeDetector.detect(tempCanvas);

                            for (const detection of detections) {
                                const code = detection.rawValue.toUpperCase().trim();
                                if (code === TARGET_QR) {
                                    activatePrivacy();
                                    return;
                                }
                            }
                        } catch (err) {
                            // Silent fail
                        }
                    }, 300);
                } else {
                    // jsQR fallback via CDN
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
                    script.onload = () => {
                        qrScanInterval = setInterval(() => {
                            if (privacyActive) {
                                qrOverlay.classList.add('hidden');
                                return;
                            }

                            try {
                                if (!video || video.readyState < 2) return;

                                const tempCanvas = document.createElement('canvas');
                                tempCanvas.width = Math.min(video.videoWidth || 640, 480);
                                tempCanvas.height = Math.min(video.videoHeight || 480, 360);
                                const tempCtx = tempCanvas.getContext('2d');
                                tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas
                                .height);

                                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width,
                                    tempCanvas.height);
                                const code = jsQR(imageData.data, imageData.width, imageData
                                .height);

                                if (code && code.data) {
                                    const decoded = code.data.toUpperCase().trim();
                                    if (decoded === TARGET_QR) {
                                        activatePrivacy();
                                        return;
                                    }
                                }
                            } catch (err) {
                                // Silent fail
                            }
                        }, 400);
                    };
                    document.head.appendChild(script);
                }
            }

            // ================================================================
            // 3. ACTIVATE PRIVACY
            // ================================================================

            function activatePrivacy() {
                if (privacyActive) return;
                privacyActive = true;

                statusDot.className = 'dot active';
                statusText.textContent = '●';
                qrOverlay.classList.add('hidden');

                if (qrScanInterval) {
                    clearInterval(qrScanInterval);
                    qrScanInterval = null;
                }

                console.log('✅ Privacy Activated — faces will blur');
            }

            // ================================================================
            // 4. PRIVACY BLUR
            // ================================================================

            function applyPrivacyMask(faces) {
                if (!faces || faces.length === 0) return;

                for (const face of faces) {
                    const x = Math.max(0, face.x * canvas.width);
                    const y = Math.max(0, face.y * canvas.height);
                    const w = Math.min(canvas.width - x, face.width * canvas.width);
                    const h = Math.min(canvas.height - y, face.height * canvas.height);

                    if (w < 10 || h < 10) continue;

                    try {
                        const imageData = ctx.getImageData(x, y, w, h);
                        const data = imageData.data;
                        const pixelSize = Math.max(6, Math.min(14, Math.round((w + h) / 40)));

                        for (let row = 0; row < h; row += pixelSize) {
                            for (let col = 0; col < w; col += pixelSize) {
                                let r = 0,
                                    g = 0,
                                    b = 0,
                                    count = 0;
                                for (let dy = 0; dy < pixelSize && row + dy < h; dy++) {
                                    for (let dx = 0; dx < pixelSize && col + dx < w; dx++) {
                                        const idx = ((row + dy) * w + (col + dx)) * 4;
                                        r += data[idx];
                                        g += data[idx + 1];
                                        b += data[idx + 2];
                                        count++;
                                    }
                                }
                                if (count > 0) {
                                    r = Math.round(r / count);
                                    g = Math.round(g / count);
                                    b = Math.round(b / count);
                                }

                                for (let dy = 0; dy < pixelSize && row + dy < h; dy++) {
                                    for (let dx = 0; dx < pixelSize && col + dx < w; dx++) {
                                        const idx = ((row + dy) * w + (col + dx)) * 4;
                                        data[idx] = r;
                                        data[idx + 1] = g;
                                        data[idx + 2] = b;
                                    }
                                }
                            }
                        }

                        ctx.putImageData(imageData, x, y);

                        // Subtle privacy border
                        ctx.strokeStyle = 'rgba(239, 68, 68, 0.2)';
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([4, 6]);
                        ctx.strokeRect(x, y, w, h);
                        ctx.setLineDash([]);

                    } catch (err) {
                        // Skip if image data fails
                    }
                }
            }

            // ================================================================
            // 5. UPDATE UI
            // ================================================================

            function updateFaceCount() {
                faceCount.textContent = detectedFaces.length > 0 ? detectedFaces.length + ' faces' : '';
            }

            // ================================================================
            // 6. PROCESS LOOP
            // ================================================================

            let useFallback = false;

            function processFrame() {
                if (!isReady || !video || video.readyState < 2) {
                    requestAnimationFrame(processFrame);
                    return;
                }

                try {
                    // Draw video
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    // Face detection
                    let faces = [];

                    if (faceDetector && !useFallback) {
                        // MediaPipe is running asynchronously
                        // The results come through onResults callback
                        faces = detectedFaces;
                    }

                    // If MediaPipe isn't ready, use fallback
                    if (!faceDetector || useFallback) {
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = 320;
                        tempCanvas.height = 240;
                        const tempCtx = tempCanvas.getContext('2d');
                        tempCtx.drawImage(video, 0, 0, 320, 240);
                        const imageData = tempCtx.getImageData(0, 0, 320, 240);

                        const simpleFaces = simpleFaceDetect(imageData);
                        if (simpleFaces.length > 0) {
                            faces = simpleFaces;
                            detectedFaces = simpleFaces;
                            updateFaceCount();
                            // Use fallback if MediaPipe isn't working
                            if (!faceDetector) {
                                useFallback = true;
                            }
                        }
                    }

                    // Apply privacy blur if active
                    if (privacyActive && faces.length > 0) {
                        applyPrivacyMask(faces);
                    }

                    // Call MediaPipe send if available
                    if (faceDetector && !useFallback) {
                        try {
                            faceDetector.send({ image: video });
                        } catch (err) {
                            useFallback = true;
                        }
                    }

                    requestAnimationFrame(processFrame);

                } catch (error) {
                    console.error('Process error:', error);
                    requestAnimationFrame(processFrame);
                }
            }

            // ================================================================
            // 7. CAMERA
            // ================================================================

            async function startCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        },
                        audio: false
                    });

                    video.srcObject = stream;

                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        isReady = true;

                        // Try MediaPipe first
                        const mpReady = initMediaPipe();

                        // If MediaPipe fails, fallback is automatic
                        if (!mpReady) {
                            useFallback = true;
                            console.log('⚠️ Using fallback face detection');
                        }

                        processFrame();
                        startAutoQRScanner();
                    };

                } catch (error) {
                    console.error('Camera error:', error);
                    setTimeout(startCamera, 3000);
                }
            }

            // ================================================================
            // 8. INIT
            // ================================================================

            console.log('🕶️ PrivacyLens');
            console.log('📸 QR: ' + TARGET_QR);

            startCamera();

            window.addEventListener('beforeunload', () => {
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                }
                if (qrScanInterval) {
                    clearInterval(qrScanInterval);
                    qrScanInterval = null;
                }
            });

        })();
    </script>
</body>
</html>
